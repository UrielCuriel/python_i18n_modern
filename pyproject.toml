[project]
name = "i18n_modern"
version = "0.2.3"
description = "A modern internationalization library for Python with support for JSON, YAML, and TOML"
readme = "README.md"
requires-python = ">=3.8"
authors = [{ name = "Uriel Curiel", email = "urielcuriel@outlook.com" }]
license = { text = "MIT" }
keywords = [
    "i18n",
    "internationalization",
    "translation",
    "localization",
    "l10n",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.optional-dependencies]
yaml = ["pyyaml>=6.0"]
toml = ["tomli>=2.3.0; python_version<'3.11'"]
benchmark = [
    "python-i18n>=0.3.9",
    "pyi18n-v2>=1.2.0",
    "cython>=3.0.0",
    "i18nice",
    "toml-i18n",
    "pytest>=7.0",
    "pytest-benchmark>=4.0",
]
all = ["pyyaml>=6.0", "tomli>=2.3.0; python_version<'3.11'"]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "pyrefly",
    "tomli>=2.3.0; python_version<'3.11'",
    "basedpyright",
    "cython>=3.0.0",
    "setuptools>=75.3.4",
]

[project.urls]
Homepage = "https://github.com/UrielCuriel/python_i18n_modern"
Repository = "https://github.com/UrielCuriel/python_i18n_modern"
Issues = "https://github.com/UrielCuriel/python_i18n_modern/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
markers = [
    "benchmark: performance benchmarks (run with --benchmark-only)",
]
# Make `pytest` ignore the benchmark suite by default; opt-in with
# `pytest benchmarks/ --benchmark-only`.
testpaths = ["tests"]
# Defaults for pytest-benchmark to reduce variance run-to-run.
# These only take effect when the `benchmarks/` suite is invoked.
addopts = [
    "--benchmark-disable-gc",
    "--benchmark-warmup=on",
    "--benchmark-warmup-iterations=1000",
    "--benchmark-min-rounds=20",
    "--benchmark-calibration-precision=10",
    "--benchmark-sort=mean",
    "--benchmark-group-by=group",
    "--benchmark-columns=min,mean,median,stddev,ops,rounds",
]
